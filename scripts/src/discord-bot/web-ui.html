<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="referrer" content="no-referrer"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#0a0a0c"/>
<title>EverGuard Search</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0a0c; --surface: #121216; --surface-2: #1a1a20; --surface-3: #24242c;
  --border: #26262e; --border-strong: #383842;
  --text: #f4f4f6; --text-2: #c7c7d1; --muted: #9b9ba8;
  --accent: #5865f2; --accent-hover: #4752c4; --accent-text: #9aa2ff; --ring: #aab1ff;
  --ok: #4ade80; --danger: #f87171;
  --radius: 12px; --radius-sm: 8px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --skeleton: #16161b; --skeleton-hi: #212129;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--text); min-height: 100vh;
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ── Header ──────────────────────────────────────────────────────────────── */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(10, 10, 12, .88);
  -webkit-backdrop-filter: saturate(140%) blur(12px); backdrop-filter: saturate(140%) blur(12px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1440px; margin: 0 auto; padding: 12px 24px;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 24px;
}
.brand {
  display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none;
  font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; border-radius: 10px;
}
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #5865f2, #8b5cf6);
}
.privacy-badge {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; user-select: none;
  color: var(--ok); background: rgba(74, 222, 128, .1); border: 1px solid rgba(74, 222, 128, .25);
}

/* ── Search ──────────────────────────────────────────────────────────────── */
.search-row {
  position: relative; display: flex; align-items: center; width: 100%; max-width: 680px; margin: 0 auto;
  background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 999px;
  transition: border-color .15s, box-shadow .15s;
}
.search-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88, 101, 242, .28); }
.search-icon { position: absolute; left: 16px; color: var(--muted); pointer-events: none; }
.search-row input {
  flex: 1; min-width: 0; height: 46px; padding: 0 12px 0 46px;
  background: transparent; border: 0; outline: none; color: var(--text); font-size: 1rem;
  -webkit-appearance: none; appearance: none;
}
.search-row input::placeholder { color: var(--muted); }
.search-row input::-webkit-search-cancel-button { filter: invert(.6); cursor: pointer; }
.search-row button {
  margin: 4px; height: 38px; padding: 0 20px; flex-shrink: 0;
  border: 0; border-radius: 999px; background: var(--accent); color: #fff;
  font-size: .92rem; font-weight: 600; cursor: pointer; transition: background .15s;
  touch-action: manipulation;
}
.search-row button:hover { background: var(--accent-hover); }

.autocomplete {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 100; display: none;
  padding: 6px; background: var(--surface-2); border: 1px solid var(--border-strong);
  border-radius: 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, .55);
}
.autocomplete.open { display: block; }
.ac-item {
  display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px;
  border-radius: var(--radius-sm); font-size: .92rem; color: var(--text); cursor: pointer;
}
.ac-item:hover, .ac-item.focused { background: var(--surface-3); }
.ac-item svg { color: var(--muted); flex-shrink: 0; }

/* ── Site filter ─────────────────────────────────────────────────────────── */
.filter-bar { max-width: 1440px; margin: 0 auto; padding: 0 24px 12px; display: flex; align-items: center; gap: 12px; }
.filter-label { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.source-chips {
  display: flex; gap: 8px; min-width: 0; padding: 2px 32px 2px 2px;
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
}
.source-chips::-webkit-scrollbar { display: none; }
.chip {
  --site: var(--muted);
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; flex-shrink: 0;
  border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface);
  color: var(--text-2); font-size: .84rem; font-weight: 600; white-space: nowrap; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--site); flex-shrink: 0; }
.chip:hover { background: var(--surface-3); color: var(--text); }
.chip.active { background: var(--text); border-color: var(--text); color: #0a0a0c; }
.chip[data-src="all"] { --site: linear-gradient(135deg, #5865f2, #8b5cf6); }
.chip-ph { --site: #ff9000; }
.chip-xv { --site: #e11d1d; }
.chip-xnxx { --site: #f5c518; }
.chip-xxbrits { --site: #3b8cff; }
.chip-fpoxxx { --site: #a855f7; }
.chip-freepornvideos { --site: #ef4444; }
.chip-taboodude { --site: #e11d48; }
.chip-hqporner { --site: #22c55e; }
.chip-fullporn { --site: #f97316; }
.chip-tiava { --site: #8b5cf6; }

/* ── Main ────────────────────────────────────────────────────────────────── */
main { max-width: 1440px; margin: 0 auto; padding: 24px 24px 64px; }
.section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }
.section-head svg { color: #fb923c; }
.section-head .sub { margin-left: auto; font-size: .82rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.status { color: var(--muted); font-size: .88rem; margin-bottom: 18px; }
.status:empty { display: none; }

/* ── Cards ───────────────────────────────────────────────────────────────── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px 20px; }
.card { cursor: pointer; border-radius: var(--radius); outline-offset: 4px; -webkit-tap-highlight-color: transparent; }
.thumb-wrap { position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); }
.thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s var(--ease); }
.card:hover .thumb-wrap img { transform: scale(1.04); }
.no-thumb { display: grid; place-items: center; width: 100%; height: 100%; color: var(--border-strong); font-size: 1.8rem; }
.play-overlay {
  position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .2s;
  background: linear-gradient(to top, rgba(0, 0, 0, .5), rgba(0, 0, 0, .1) 60%);
}
.card:hover .play-overlay, .card:focus-visible .play-overlay { opacity: 1; }
.dur-badge {
  position: absolute; right: 8px; bottom: 8px; padding: 2px 6px; border-radius: 6px;
  background: rgba(0, 0, 0, .82); color: #fff; font-size: .72rem; font-weight: 600; font-variant-numeric: tabular-nums;
}
.card-info { padding: 10px 2px 0; }
.card-title { font-size: .92rem; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-actors { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: .8rem; color: var(--muted); }
.card-actors span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }

.badge {
  display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px;
  font-size: .68rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: #fff;
}
.badge-pornhub  { background: #ff9000; color: #000; }
.badge-xvideos  { background: #c20000; }
.badge-xnxx     { background: #f5c518; color: #000; }
.badge-xxbrits  { background: #1565c0; }
.badge-fpoxxx   { background: #8e44ad; }
.badge-freepornvideos { background: #c0392b; }
.badge-taboodude { background: #9f1239; }
.badge-hqporner { background: #15803d; }
.badge-fullporn { background: #b45309; }
.badge-tiava    { background: #6d28d9; }

/* ── Skeletons ───────────────────────────────────────────────────────────── */
@keyframes shimmer { from { background-position: -600px 0; } to { background-position: 600px 0; } }
.skeleton-thumb, .skeleton-line {
  background: linear-gradient(90deg, var(--skeleton) 25%, var(--skeleton-hi) 50%, var(--skeleton) 75%);
  background-size: 600px 100%; animation: shimmer 1.4s infinite linear;
}
.skeleton-thumb { aspect-ratio: 16 / 9; border-radius: var(--radius); }
.skeleton-info { padding: 12px 2px 0; display: flex; flex-direction: column; gap: 8px; }
.skeleton-line { height: 12px; border-radius: 6px; }
.skeleton-line.short { width: 40%; }

.feed-status { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 32px 0 8px; color: var(--muted); font-size: .88rem; }
.feed-status:empty { padding: 0; }
.feed-status .spinner { width: 24px; height: 24px; }

/* ── Pagination ──────────────────────────────────────────────────────────── */
.pagination { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; padding-top: 40px; }
.pg-btn {
  display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 40px; padding: 0 12px;
  border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--text-2);
  font-size: .9rem; font-weight: 600; cursor: pointer; user-select: none;
  transition: background .15s, color .15s; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pg-btn:hover:not(:disabled):not(.active) { background: var(--surface-3); color: var(--text); }
.pg-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; cursor: default; }
.pg-btn:disabled { opacity: .35; cursor: default; }
.pg-dots { color: var(--muted); padding: 0 4px; user-select: none; }

/* ── Top progress bar ────────────────────────────────────────────────────── */
#page-loading {
  display: none; position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 999;
  background: linear-gradient(90deg, #5865f2, #8b5cf6); animation: progress-bar 1.2s ease-in-out infinite;
}
#page-loading.active { display: block; }
@keyframes progress-bar {
  0% { transform: scaleX(0); transform-origin: left; }
  50% { transform: scaleX(.7); transform-origin: left; }
  100% { transform: scaleX(1); transform-origin: left; opacity: 0; }
}

/* ── Video page ──────────────────────────────────────────────────────────── */
.vp-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: var(--bg); }
.vp-overlay.open { display: flex; flex-direction: column; }
.vp-topbar {
  display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 20px; flex-shrink: 0;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.vp-back {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; flex-shrink: 0;
  border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface-2);
  font-size: .88rem; font-weight: 600; cursor: pointer; transition: background .15s;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.vp-back:hover { background: var(--surface-3); }
.vp-topbar-title { flex: 1; min-width: 0; font-size: .95rem; font-weight: 600; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vp-body {
  flex: 1; min-height: 0; width: 100%; max-width: 1760px; margin: 0 auto; padding: 24px;
  display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px;
}
.vp-left { min-height: 0; overflow-y: auto; }
.vp-player-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 74vh; background: #000; border-radius: var(--radius); overflow: hidden; }
.vp-player-wrap video { width: 100%; height: 100%; display: none; background: #000; }
.vp-vid-status {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 16px; text-align: center; color: var(--text-2); font-size: .92rem; pointer-events: none;
}
.vp-vid-status a { color: var(--accent-text); pointer-events: auto; }
.spinner { width: 36px; height: 36px; border: 3px solid rgba(255, 255, 255, .15); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

.vp-info { padding: 20px 2px 8px; }
.vp-info h2 { font-size: 1.3rem; font-weight: 700; line-height: 1.35; letter-spacing: -.01em; }
.vp-actors { flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); }
.actor-btn {
  height: 32px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 999px;
  background: var(--surface-2); font-size: .82rem; font-weight: 600; cursor: pointer; transition: border-color .15s, background .15s;
}
.actor-btn:hover { border-color: var(--accent); background: var(--surface-3); }
.vp-info-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 14px; }
.ext-link { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; font-weight: 600; text-decoration: none; }
.ext-link:hover { text-decoration: underline; }
.ext-warn {
  padding: 1px 6px; border-radius: 4px; font-size: .66rem; font-weight: 700; white-space: nowrap;
  color: var(--danger); background: rgba(248, 113, 113, .12); border: 1px solid rgba(248, 113, 113, .3);
}
.vp-desc {
  margin-top: 14px; padding: 12px 14px; max-height: calc(1.6em * 4 + 24px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text-2); font-size: .88rem; line-height: 1.6;
}
.privacy-note { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: .8rem; color: var(--ok); }

.find-on-wrap { flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
.find-on-label { margin-right: 4px; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fon-chip {
  height: 32px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 999px;
  background: var(--surface); color: var(--text-2); font-size: .8rem; font-weight: 600; white-space: nowrap; cursor: pointer;
  transition: border-color .15s, color .15s; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.fon-chip:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
.fon-chip:disabled { opacity: .45; cursor: progress; }
.fon-chip.fon-active { background: var(--accent); border-color: var(--accent); color: #fff; cursor: default; }
.fon-status { min-height: 1.3em; margin-top: 10px; font-size: .82rem; color: var(--muted); }
.fon-thumb-ref { gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.fon-thumb-block { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.fon-thumb-block span { font-size: .72rem; font-weight: 600; color: var(--muted); }
.fon-thumb-ref img { width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); }
.fon-match-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: .68rem; font-weight: 700; }
.fon-match-high { color: #4ade80; background: rgba(74, 222, 128, .14); border: 1px solid rgba(74, 222, 128, .35); }
.fon-match-mid  { color: #fbbf24; background: rgba(251, 191, 36, .14); border: 1px solid rgba(251, 191, 36, .35); }
.fon-match-low  { color: #f87171; background: rgba(248, 113, 113, .12); border: 1px solid rgba(248, 113, 113, .3); }

.vp-right {
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
}
.vp-related-head { padding: 14px 16px; font-size: .95rem; font-weight: 700; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.vp-related-list { flex: 1; overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
.related-card { display: flex; gap: 12px; padding: 8px; border-radius: 10px; cursor: pointer; transition: background .15s; -webkit-tap-highlight-color: transparent; }
.related-card:hover { background: var(--surface-3); }
.related-thumb { position: relative; width: 160px; aspect-ratio: 16 / 9; border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-2); flex-shrink: 0; }
.related-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.related-thumb .dur-badge { right: 5px; bottom: 5px; }
.related-info { flex: 1; min-width: 0; }
.related-title { font-size: .85rem; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.related-meta { margin-top: 6px; }
.related-loading { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 16px; text-align: center; font-size: .86rem; color: var(--muted); }

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media (max-width: 1180px) {
  .vp-body { grid-template-columns: minmax(0, 1fr) 340px; }
  .related-thumb { width: 132px; }
}
@media (max-width: 900px) {
  .vp-overlay { overflow-y: auto; }
  .vp-topbar { position: sticky; top: 0; z-index: 10; height: 56px; padding: 0 12px; }
  .vp-body { display: block; flex: none; padding: 0 0 32px; }
  .vp-left { overflow: visible; }
  .vp-player-wrap { border-radius: 0; max-height: none; }
  .vp-info { padding: 16px; }
  .vp-right { margin: 8px 16px 0; overflow: visible; }
  .vp-related-list { overflow: visible; }
}
@media (max-width: 720px) {
  .site-header { position: static; }
  .header-inner { grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 12px 16px; }
  .header-inner .search-row { grid-column: 1 / -1; grid-row: 2; max-width: none; }
  .filter-bar { padding: 0 0 12px 16px; }
  .filter-label { display: none; }
  main { padding: 16px 16px 48px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; }
  .card-title { font-size: .85rem; }
  .section-head { font-size: 1.05rem; }
  .pg-dots { display: none; }
  .pg-btn.pg-num:not(.active):not(.pg-near) { display: none; }
  .vp-info h2 { font-size: 1.08rem; }
  .vp-related-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 12px; }
  .related-card { flex-direction: column; gap: 8px; padding: 0; }
  .related-card:hover { background: none; }
  .related-thumb { width: 100%; }
  .related-title { -webkit-line-clamp: 2; }
}
@media (max-width: 340px) {
  .grid, .vp-related-list { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .spinner { animation-duration: 1.6s !important; animation-iteration-count: infinite !important; }
  .card:hover .thumb-wrap img { transform: none; }
}
</style>
</head>
<body>

<div id="page-loading"></div>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/" aria-label="EverGuard Search home">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="20.5" y1="20.5" x2="16" y2="16"/></svg>
      </span>
      EverGuard
    </a>
    <div class="search-row" id="search-row" role="search">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="20.5" y1="20.5" x2="16" y2="16"/></svg>
      <label for="q" class="sr-only">Search videos</label>
      <input id="q" type="search" placeholder="Search videos" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-controls="autocomplete"/>
      <button id="search-btn" type="button" onclick="doSearch()">Search</button>
      <div class="autocomplete" id="autocomplete"></div>

    return words.slice(0, 3).join(' ') || null;
  }

  function makeRelatedCard(r) {
    var wrap = document.createElement('div');
    wrap.className = 'related-card';
    var thumbInner = r.thumbnail
      ? '<img src="' + thumbUrl(r.thumbnail) + '" alt="" loading="lazy" onerror="this.parentNode.insertAdjacentHTML(\'afterbegin\',\'<div class=no-thumb>\u25b6</div>\');this.remove()">'
      : '<div class="no-thumb">\u25b6</div>';
    var durHtml = r.duration ? '<span class="dur-badge">' + esc(r.duration) + '</span>' : '';
    wrap.innerHTML =
      '<div class="related-thumb">' + thumbInner + durHtml + '</div>' +
      '<div class="related-info">' +
        '<div class="related-title">' + esc(r.title) + '</div>' +
        '<div class="related-meta">' + badgeHtml(r.source) + '</div>' +
      '</div>';
    makeActivatable(wrap, r.title + (r.duration ? ', ' + r.duration : ''), function() {
      vpVid.pause();
      openVideoPage(r);
    });
    prefetchOnHover(wrap, r.url);
    return wrap;
  }

  function closeVideoPage() {
    if (!vpOverlay.classList.contains('open')) return;
    loadSeq++;
    relatedSeq++;
    vpOverlay.classList.remove('open');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
    document.body.style.overflow = '';
    vpVid.pause();
    vpVid.removeAttribute('src');
    vpVid.load();
    vpVid.style.display = 'none';
    vpVidStatus.style.display = 'flex';
    vpVidStatus.innerHTML = '<div class="spinner"></div><span>Loading video\u2026</span>';
  }

  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeVideoPage(); });

  /* ── Exports ─────────────────────────────────────────────────────────────── */
  window.doSearch       = doSearch;
  window.closeVideoPage = closeVideoPage;

  /* ── Boot ────────────────────────────────────────────────────────────────── */
  // Restoring an old scroll position on reload would chain-load the feed to reach it.
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  loadTrending();
})();
</script>
</body>
</html>
